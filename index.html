<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CATEUS — A Arena dos Deuses (protótipo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#1a120c;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block;outline:none}
  .tb{position:fixed;display:none;align-items:center;justify-content:center;border-radius:50%;
      background:rgba(255,248,230,.18);border:3px solid #2b2118;color:#2b2118;
      font:700 13px Fredoka,sans-serif;-webkit-tap-highlight-color:transparent;touch-action:none;box-shadow:0 3px 0 #2b2118}
  .tb.on{background:rgba(255,248,230,.5)}
  body.touch .tb{display:flex}
  body.touch .tb.hide{display:none}
  #bA{right:18px;bottom:26px;width:92px;height:92px;background:rgba(255,220,120,.55)}
  #bD{right:124px;bottom:20px;width:70px;height:70px;background:rgba(140,220,255,.5)}
  #bF{right:40px;bottom:132px;width:70px;height:70px;background:rgba(255,120,40,.6)}
  #bE{right:132px;bottom:104px;width:58px;height:58px;font-size:11px;background:rgba(200,160,255,.5)}
  #bB{right:18px;top:14px;width:64px;height:64px;font-size:10px}
  #bH{right:92px;top:14px;width:56px;height:56px;font-size:11px;background:rgba(255,220,120,.55)}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div class="tb" id="bA" data-k="atk">ARRANHAR</div>
<div class="tb" id="bD" data-k="dash">DASH</div>
<div class="tb hide" id="bF" data-k="fire">PODER</div>
<div class="tb hide" id="bE" data-k="elem">ELEM.</div>
<div class="tb" id="bB" data-k="bag">MOCHILA</div>
<div class="tb" id="bH" data-k="heal">CURA</div>
<script>/* CATEUS — animação "fantoche" da arte do gato + efeitos detalhados de cada skin */
const CatFX = (() => {
  const rnd = (a, b) => a + Math.random() * (b - a);
  const parts = [], floor = [];
  let arcs = [], arcT = 0, flashT = 0, stepAcc = 0, orbitT = 0;

  /* ---------- animação da arte (sem cortar em partes) ---------- */
  // desenha a imagem ancorada nos pés com respiração, balanço (skew), inclinação, squash e stretch
  function puppet(ctx, img, x, y, h, st) {
    if (!img || !img.complete || !img.naturalWidth) return;
    const w = img.naturalWidth * h / img.naturalHeight, t = st.t, at = st.at || 0;
    let sx = 1, sy = 1, skew = 0, rot = 0, dy = 0, dx = 0;
    const br = Math.sin(t * 2.6);
    sy += 0.022 * br; sx -= 0.012 * br; skew = 0.025 * Math.sin(t * 1.3);
    if (st.anim === 'walk') { const q = t * 11; dy = -Math.abs(Math.sin(q)) * h * 0.06; skew = 0.09 * Math.sin(q); sy = 1 + 0.04 * Math.cos(q * 2); sx = 1 - 0.03 * Math.cos(q * 2); rot = 0.03 * Math.sin(q); }
    if (st.anim === 'scratch') { const k = Math.min(1, at / 0.3);
      if (k < 0.35) { const e = k / 0.35; skew = -0.12 * e; sy = 1 + 0.08 * e; sx = 1 - 0.05 * e; }
      else if (k < 0.6) { skew = 0.28; sx = 1.12; sy = 0.9; dx = h * 0.08; }
      else { const e = (k - 0.6) / 0.4; skew = 0.28 * (1 - e); sx = 1 + 0.12 * (1 - e); sy = 1 - 0.1 * (1 - e); dx = h * 0.08 * (1 - e); } }
    if (st.anim === 'dash') { skew = 0.38; sx = 1.2; sy = 0.86; dy = -h * 0.05; }
    if (st.anim === 'hurt') { skew = -0.2; sx = 0.92; sy = 1.06; dx = -h * 0.05 + rnd(-3, 3); }
    ctx.save(); ctx.translate(x, y);
    if (st.facing < 0) ctx.scale(-1, 1);
    ctx.translate(dx, dy); ctx.rotate(rot);
    ctx.transform(1, 0, -skew, 1, 0, 0); // balanço: a cabeça vai mais longe que os pés
    ctx.scale(sx, sy);
    if (st.flash) ctx.filter = 'brightness(3) saturate(0)';
    else if (st.tint) ctx.filter = st.tint;
    ctx.drawImage(img, -w / 2, -h, w, h);
    ctx.restore();
  }

  /* ---------- efeitos ---------- */
  const PAL = {
    fogo: { aura: ['rgba(255,120,30,0.30)', 'rgba(255,60,10,0)'], p: ['#ff5a14', '#ff9a20', '#ffd23f', '#fff3b0'] },
    agua: { aura: ['rgba(60,170,255,0.24)', 'rgba(30,110,220,0)'], p: ['#2a8ef0', '#60c8ff', '#b8f0ff', '#ffffff'] },
    planta: { aura: ['rgba(120,220,80,0.22)', 'rgba(40,140,40,0)'], p: ['#3f8a2a', '#6ac040', '#a8e070', '#ffd84a'] },
    raio: { aura: ['rgba(255,235,110,0.26)', 'rgba(90,140,255,0)'], p: ['#fff8a0', '#ffe040', '#9ad0ff', '#ffffff'] },
    normal: { aura: ['rgba(255,240,200,0.18)', 'rgba(255,240,200,0)'], p: ['#fff6d8', '#ffffff', '#ffe7a0', '#fff6d8'] },
  };
  function update(dt, cat) {
    const { x, y, h, skin, moving, facing } = cat; const pal = PAL[skin] || PAL.normal;
    orbitT += dt; arcT -= dt; flashT -= dt;
    const top = y - h, cx = x;
    const add = (o) => { parts.push(o); if (parts.length > 420) parts.shift(); };
    if (skin === 'fogo') {
      for (let i = 0; i < 3; i++) add({ k: 'ember', x: cx + rnd(-h * 0.3, h * 0.3), y: y - rnd(0, h * 0.9), vx: rnd(-20, 20), vy: rnd(-90, -40), life: rnd(0.5, 1.1), max: 1.1, s: rnd(1.5, 4) * h / 100, c: pal.p[Math.floor(rnd(0, 4))], sw: rnd(0, 6) });
      if (Math.random() < 0.18) add({ k: 'flame', x: cx + rnd(-h * 0.18, h * 0.18), y: top + h * rnd(0.05, 0.15), vx: rnd(-10, 10), vy: rnd(-70, -40), life: 0.45, max: 0.45, s: rnd(5, 9) * h / 100 });
    } else if (skin === 'agua') {
      if (Math.random() < 0.35) add({ k: 'bubble', x: cx + rnd(-h * 0.35, h * 0.35), y: y - rnd(0, h * 0.5), vx: 0, vy: rnd(-50, -25), life: rnd(1, 1.8), max: 1.8, s: rnd(2.5, 6) * h / 100, sw: rnd(0, 6) });
      if (Math.random() < 0.25) add({ k: 'drip', x: cx + rnd(-h * 0.25, h * 0.25), y: y - rnd(h * 0.2, h * 0.8), vx: rnd(-10, 10), vy: 20, g: 500, life: 0.7, max: 0.7, s: rnd(2, 3.5) * h / 100, c: pal.p[Math.floor(rnd(0, 3))] });
    } else if (skin === 'planta') {
      if (Math.random() < 0.3) add({ k: 'petal', x: cx + rnd(-h * 0.5, h * 0.5), y: top - rnd(0, h * 0.2), vx: rnd(-25, 25), vy: rnd(25, 45), life: rnd(1.4, 2.2), max: 2.2, s: rnd(3, 5.5) * h / 100, r: rnd(0, 6), vr: rnd(-4, 4), c: Math.random() < 0.6 ? pal.p[Math.floor(rnd(0, 3))] : (Math.random() < 0.5 ? '#ffb0c8' : '#ffd84a') });
      if (Math.random() < 0.3) add({ k: 'pollen', x: cx + rnd(-h * 0.4, h * 0.4), y: y - rnd(0, h), vx: rnd(-8, 8), vy: rnd(-15, -5), life: rnd(0.8, 1.5), max: 1.5, s: rnd(1, 2.2) * h / 100 });
    } else if (skin === 'raio') {
      if (arcT <= 0) { arcT = rnd(0.05, 0.11); arcs = []; const n = Math.random() < 0.3 ? 3 : 2;
        for (let i = 0; i < n; i++) { const a = [cx + rnd(-h * 0.35, h * 0.35), y - rnd(h * 0.1, h * 0.95)], b = [a[0] + rnd(-h * 0.45, h * 0.45), a[1] + rnd(-h * 0.3, h * 0.3)]; arcs.push(bolt(a, b, h * 0.06, 5)); } }
      if (Math.random() < 0.012) flashT = 0.08;
      if (Math.random() < 0.6) add({ k: 'spark', x: cx + rnd(-h * 0.35, h * 0.35), y: y - rnd(0, h), vx: rnd(-160, 160), vy: rnd(-160, 60), g: 300, life: rnd(0.15, 0.35), max: 0.35, s: rnd(1.5, 3) * h / 100, c: pal.p[Math.floor(rnd(0, 4))] });
    } else if (Math.random() < 0.08) add({ k: 'pollen', x: cx + rnd(-h * 0.4, h * 0.4), y: y - rnd(0, h), vx: 0, vy: -8, life: 1.2, max: 1.2, s: 1.4 * h / 100 });
    // marcas no chão a cada passo
    if (moving) { stepAcc += dt; if (stepAcc > 0.2) { stepAcc = 0; const fx = x + rnd(-h * 0.12, h * 0.12);
      if (skin === 'fogo') floor.push({ k: 'fire', x: fx, y: y - 2, life: 0.9, max: 0.9, s: h / 100 });
      else if (skin === 'agua') floor.push({ k: 'ripple', x: fx, y, life: 0.9, max: 0.9, s: h / 100 });
      else if (skin === 'planta') floor.push({ k: 'sprout', x: fx, y, life: 1.6, max: 1.6, s: h / 100, v: Math.floor(rnd(0, 3)) });
      else if (skin === 'raio') floor.push({ k: 'zap', x: fx, y, life: 0.35, max: 0.35, s: h / 100, b: bolt([fx - h * 0.2, y], [fx + h * 0.2, y], h * 0.03, 4) });
      else floor.push({ k: 'dust', x: fx, y, life: 0.5, max: 0.5, s: h / 100 });
      if (floor.length > 40) floor.shift(); } }
    for (let i = parts.length - 1; i >= 0; i--) { const q = parts[i]; q.life -= dt; if (q.life <= 0) { parts.splice(i, 1); continue; }
      q.vy += (q.g || 0) * dt; q.x += q.vx * dt + (q.sw !== undefined ? Math.sin(orbitT * 6 + q.sw) * 0.4 : 0); q.y += q.vy * dt; if (q.vr) q.r += q.vr * dt; if (q.k === 'petal') q.vx += Math.sin(orbitT * 3 + q.r) * 20 * dt; }
    for (let i = floor.length - 1; i >= 0; i--) { floor[i].life -= dt; if (floor[i].life <= 0) floor.splice(i, 1); }
  }
  function bolt(a, b, jag, n) { const pts = [a]; for (let i = 1; i < n; i++) { const k = i / n; pts.push([a[0] + (b[0] - a[0]) * k + rnd(-jag, jag) * 2, a[1] + (b[1] - a[1]) * k + rnd(-jag, jag) * 2]); } pts.push(b); return pts; }
  function strokeBolt(ctx, pts, w, col) {
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    for (const [lw, c, a] of [[w * 4, col, 0.25], [w * 2, col, 0.6], [w * 0.8, '#ffffff', 1]]) { ctx.globalAlpha = a; ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (const p of pts) ctx.lineTo(p[0], p[1]); ctx.stroke(); }
    ctx.globalAlpha = 1;
  }
  function flameShape(ctx, x, y, s, t, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(x - 6 * s, y); ctx.quadraticCurveTo(x - 7 * s, y - 9 * s, x + Math.sin(t * 9) * 2 * s, y - 18 * s); ctx.quadraticCurveTo(x + 7 * s, y - 9 * s, x + 6 * s, y); ctx.quadraticCurveTo(x, y + 3 * s, x - 6 * s, y); ctx.fill(); }

  // chão (antes do gato)
  function drawFloor(ctx, cat) {
    const { x, y, h, skin } = cat, pal = PAL[skin] || PAL.normal, t = orbitT;
    ctx.save();
    // brilho no chão
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.6; const g = ctx.createRadialGradient(x, y, 0, x, y, h * 0.6); g.addColorStop(0, pal.aura[0]); g.addColorStop(1, pal.aura[1]);
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(x, y, h * 0.6, h * 0.2, 0, 0, 7); ctx.fill();
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    for (const f of floor) { const k = f.life / f.max;
      if (f.k === 'ripple') { ctx.strokeStyle = `rgba(160,230,255,${k})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(f.x, f.y, (1 - k) * 30 * f.s + 4, (1 - k) * 9 * f.s + 1, 0, 0, 7); ctx.stroke(); }
      else if (f.k === 'fire') { ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = k; flameShape(ctx, f.x, f.y, 0.7 * f.s * (0.6 + k * 0.6), t + f.x, '#ff6a14'); flameShape(ctx, f.x, f.y, 0.4 * f.s * (0.6 + k * 0.6), t + f.x + 1, '#ffd23f'); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; }
      else if (f.k === 'sprout') { const gr = Math.min(1, (f.max - f.life) * 4); ctx.globalAlpha = Math.min(1, f.life * 2); ctx.strokeStyle = '#2f6e1e'; ctx.lineWidth = 2 * f.s;
        for (const a of [-0.5, 0, 0.5]) { ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.quadraticCurveTo(f.x + a * 6 * f.s, f.y - 6 * f.s * gr, f.x + a * 10 * f.s, f.y - 12 * f.s * gr); ctx.stroke(); }
        if (f.v === 0 && gr >= 1) { ctx.fillStyle = '#ffb0c8'; ctx.beginPath(); ctx.arc(f.x, f.y - 13 * f.s, 3 * f.s, 0, 7); ctx.fill(); ctx.fillStyle = '#ffd84a'; ctx.beginPath(); ctx.arc(f.x, f.y - 13 * f.s, 1.3 * f.s, 0, 7); ctx.fill(); }
        ctx.globalAlpha = 1; }
      else if (f.k === 'zap') { ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = k; strokeBolt(ctx, f.b, 1.5 * f.s, '#ffe040'); ctx.globalCompositeOperation = 'source-over'; }
      else if (f.k === 'dust') { ctx.fillStyle = `rgba(220,196,150,${k * 0.6})`; ctx.beginPath(); ctx.ellipse(f.x, f.y - 2, (1 - k) * 14 * f.s + 3, (1 - k) * 5 * f.s + 1, 0, 0, 7); ctx.fill(); }
    }
    ctx.restore();
  }
  // atrás do gato
  function drawBack(ctx, cat) {
    const { x, y, h, skin } = cat, pal = PAL[skin] || PAL.normal, t = orbitT;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const pulse = 1 + 0.06 * Math.sin(t * 4);
    const g = ctx.createRadialGradient(x, y - h * 0.5, h * 0.1, x, y - h * 0.5, h * 0.75 * pulse); g.addColorStop(0, pal.aura[0]); g.addColorStop(1, pal.aura[1]);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y - h * 0.5, h * 0.75 * pulse, 0, 7); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    if (skin === 'fogo') { // juba de fogo atrás da cabeça
      for (let i = 0; i < 7; i++) { const a = -Math.PI / 2 + (i - 3) * 0.32, r = h * 0.36, s = h / 100 * (1.4 + 0.3 * Math.sin(t * 7 + i));
        const fx = x + Math.cos(a) * r * 0.9, fy = y - h * 0.66 + Math.sin(a) * r * 0.75;
        ctx.save(); ctx.translate(fx, fy); ctx.rotate(a + Math.PI / 2); ctx.globalAlpha = 0.9; flameShape(ctx, 0, 0, s, t + i, '#e8380c'); flameShape(ctx, 0, 0, s * 0.68, t + i + 2, '#ff8a14'); flameShape(ctx, 0, 0, s * 0.38, t + i + 4, '#ffd23f'); ctx.globalAlpha = 1; ctx.restore(); } }
    ctx.restore();
    orbit(ctx, cat, false);
  }
  // na frente do gato
  function drawFront(ctx, cat) {
    const { x, y, h, skin } = cat, pal = PAL[skin] || PAL.normal;
    orbit(ctx, cat, true);
    ctx.save();
    for (const q of parts) { const k = q.life / q.max;
      if (q.k === 'ember' || q.k === 'spark') { ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = Math.min(1, k * 1.5); ctx.fillStyle = q.c; ctx.beginPath(); ctx.arc(q.x, q.y, q.s * (q.k === 'ember' ? k : 1), 0, 7); ctx.fill();
        if (q.k === 'spark') { ctx.strokeStyle = q.c; ctx.lineWidth = q.s * 0.8; ctx.beginPath(); ctx.moveTo(q.x, q.y); ctx.lineTo(q.x - q.vx * 0.03, q.y - q.vy * 0.03); ctx.stroke(); } }
      else if (q.k === 'flame') { ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = k * 0.7; flameShape(ctx, q.x, q.y, q.s * 0.25 * (0.5 + k), orbitT + q.x, '#ff6a14'); }
      else if (q.k === 'bubble') { ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = Math.min(1, k * 2); ctx.strokeStyle = 'rgba(200,245,255,0.95)'; ctx.lineWidth = Math.max(1, q.s * 0.35); ctx.fillStyle = 'rgba(120,210,255,0.25)';
        ctx.beginPath(); ctx.arc(q.x, q.y, q.s, 0, 7); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(q.x - q.s * 0.35, q.y - q.s * 0.35, q.s * 0.28, 0, 7); ctx.fill(); }
      else if (q.k === 'drip') { ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = k; ctx.fillStyle = q.c; ctx.beginPath(); ctx.moveTo(q.x, q.y - q.s * 2); ctx.quadraticCurveTo(q.x + q.s, q.y, q.x, q.y + q.s); ctx.quadraticCurveTo(q.x - q.s, q.y, q.x, q.y - q.s * 2); ctx.fill(); }
      else if (q.k === 'petal') { ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = Math.min(1, k * 2); ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.r); ctx.scale(1, Math.abs(Math.sin(q.r * 1.3)) * 0.8 + 0.2);
        ctx.fillStyle = q.c; ctx.beginPath(); ctx.ellipse(0, 0, q.s, q.s * 0.5, 0, 0, 7); ctx.fill(); ctx.strokeStyle = 'rgba(43,33,24,0.6)'; ctx.lineWidth = 1; ctx.stroke(); ctx.restore(); }
      else if (q.k === 'pollen') { ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = Math.sin(k * Math.PI); ctx.fillStyle = skin === 'planta' ? '#fff3a0' : '#fff6d8'; ctx.beginPath(); ctx.arc(q.x, q.y, q.s, 0, 7); ctx.fill(); }
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'lighter';
    if (skin === 'raio') { for (const a of arcs) strokeBolt(ctx, a, h * 0.012, '#ffe040');
      if (flashT > 0) { const g = ctx.createRadialGradient(x, y - h * 0.5, 0, x, y - h * 0.5, h); g.addColorStop(0, 'rgba(255,255,220,0.6)'); g.addColorStop(1, 'rgba(255,255,220,0)'); ctx.fillStyle = g; ctx.fillRect(x - h, y - h * 1.5, h * 2, h * 2); } }
    ctx.restore();
  }
  // coisas que orbitam (gotas na água, folhas na planta) — metade passa atrás, metade na frente
  function orbit(ctx, cat, front) {
    const { x, y, h, skin } = cat, t = orbitT;
    if (skin !== 'agua' && skin !== 'planta') return;
    const n = skin === 'agua' ? 7 : 6;
    ctx.save();
    for (let i = 0; i < n; i++) {
      const a = t * (skin === 'agua' ? 1.6 : 1.1) + i / n * Math.PI * 2, depth = Math.sin(a);
      if ((depth > 0) !== front) continue;
      const ox = x + Math.cos(a) * h * 0.55, oy = y - h * (0.45 + 0.12 * Math.sin(t * 2 + i)) + depth * h * 0.12, s = h / 100 * (1 + depth * 0.25);
      ctx.globalAlpha = 0.65 + depth * 0.35;
      if (skin === 'agua') { const g = ctx.createRadialGradient(ox - s, oy - s, 0, ox, oy, 5 * s); g.addColorStop(0, '#ffffff'); g.addColorStop(0.35, '#8fdcff'); g.addColorStop(1, '#1a6ad0');
        ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(ox, oy - 7 * s); ctx.quadraticCurveTo(ox + 5 * s, oy, ox, oy + 4 * s); ctx.quadraticCurveTo(ox - 5 * s, oy, ox, oy - 7 * s); ctx.fill(); ctx.strokeStyle = 'rgba(10,50,110,0.7)'; ctx.lineWidth = 1.2; ctx.stroke(); }
      else { ctx.save(); ctx.translate(ox, oy); ctx.rotate(a * 2); ctx.scale(1, 0.5 + 0.5 * Math.abs(Math.cos(a * 1.5)));
        const g = ctx.createLinearGradient(0, -4 * s, 0, 4 * s); g.addColorStop(0, '#b8f090'); g.addColorStop(1, '#2f7a22'); ctx.fillStyle = g;
        ctx.beginPath(); ctx.moveTo(-8 * s, 0); ctx.quadraticCurveTo(0, -6 * s, 8 * s, 0); ctx.quadraticCurveTo(0, 6 * s, -8 * s, 0); ctx.fill(); ctx.strokeStyle = '#1e4a12'; ctx.lineWidth = 1.2; ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-6 * s, 0); ctx.lineTo(6 * s, 0); ctx.stroke(); ctx.restore(); }
    }
    ctx.restore();
  }
  // golpe de garra com cor da skin
  function claw(ctx, x, y, ang, k, skin, s) {
    const col = { fogo: '#ffb020', agua: '#8fdcff', planta: '#a8e070', raio: '#fff8a0', normal: '#ffffff' }[skin] || '#fff';
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.globalAlpha = k; ctx.lineCap = 'round';
    for (let i = -1; i <= 1; i++) { ctx.strokeStyle = '#2b2118'; ctx.lineWidth = 8 * s; ctx.beginPath(); ctx.arc(-24 * s, i * 12 * s, 34 * s, -0.85, 0.85); ctx.stroke();
      ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = col; ctx.lineWidth = 5 * s; ctx.stroke(); ctx.globalCompositeOperation = 'source-over'; }
    ctx.restore();
  }
  return { puppet, update, drawFloor, drawBack, drawFront, claw };
})();

function clampArena(o,m){ let hit=false; const ax=Math.max(20,RX-m), ay=Math.max(12,RY-m*0.55); const dx=(o.x-CX)/ax, dy=(o.y-CY)/ay, d=Math.hypot(dx,dy);
  if(d>1){ o.x=CX+dx/d*ax; o.y=CY+dy/d*ay; hit=true; }
  for(const [ox,oy,r] of OBS){ const rr=r+Math.min(m,24)*0.7, ex=o.x-ox, ey=(o.y-oy)*1.8, dd=Math.hypot(ex,ey); if(dd<rr){ const k=dd>0.01?rr/dd:1; o.x=ox+ex*k; o.y=oy+(dd>0.01?ey*k:rr)/1.8; hit=true; } }
  return hit; }

const KEYMAP={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
addEventListener('keydown',e=>{
  initAudio();
  const k=KEYMAP[e.code]; if(k){ K[k]=true; e.preventDefault(); mouse.used=false; return; }
  if(e.repeat) return;
  if(['KeyJ','KeyZ'].includes(e.code)){ e.preventDefault(); mouse.used=false; act('atk'); }
  else if(['Space','ShiftLeft','ShiftRight','KeyL'].includes(e.code)){ e.preventDefault(); act('dash'); }
  else if(['KeyK','KeyX'].includes(e.code)){ e.preventDefault(); mouse.used=false; act('fire'); }
  else if(e.code==='Enter'){ e.preventDefault(); act('ok'); }
  else if(e.code==='Escape'||e.code==='KeyP'){ togglePause(); }
  else if(e.code==='KeyM'){ musicOn=!musicOn; }
  else if(e.code==='KeyI'||e.code==='Tab'){ e.preventDefault(); act('bag'); }
  else if(e.code==='KeyQ'){ act('heal'); }
  else if(e.code==='KeyE'){ act('elem'); }
  else if(/^Digit[1-5]$/.test(e.code)||/^Numpad[1-5]$/.test(e.code)){ const n=+e.code.slice(-1); if(phase==='title') act('lv'+n); else if(n<=4) act('el:'+EL_ORDER[n-1]); }
});
addEventListener('keyup',e=>{ const k=KEYMAP[e.code]; if(k) K[k]=false; });
addEventListener('blur',()=>{ for(const k in K) K[k]=false; if(isPlaying()) togglePause(); });
function toLogical(cx,cy){ return {x:(cx-offX)/scale,y:(cy-offY)/scale}; }

    if(!isPlaying()||phase==='transform'){ act('ok'); return; }
    if(e.clientX<innerWidth*0.5&&joy.id===null){ joy.id=e.pointerId; joy.ox=e.clientX; joy.oy=e.clientY; joy.x=e.clientX; joy.y=e.clientY; joy.vx=joy.vy=0; }
    return; }

  if(!isPlaying()||phase==='transform'){ act('ok'); return; }
  mouse.used=true; act(e.button===2?'fire':'atk');
});
cv.addEventListener('pointermove',e=>{

    if(d>m){ joy.ox=joy.x-dx/d*m; joy.oy=joy.y-dy/d*m; dx=dx/d*m; dy=dy/d*m; } joy.vx=dx/m; joy.vy=dy/m; return; }
  if(e.pointerType!=='touch'){ const p=toLogical(e.clientX,e.clientY); mouse.x=p.x; mouse.y=p.y; }
});
const joyEnd=e=>{ if(e.pointerId===joy.id){ joy.id=null; joy.vx=joy.vy=0; } };

function isPlaying(){ return ['intro','gate','freeDone','wave','boss_intro','boss','boss_dead','transform','free'].includes(phase); }
function togglePause(){ if(phase==='pause') phase=prevPhase; else if(isPlaying()){ prevPhase=phase; phase='pause'; } }

function act(a){
  if(a==='bag'){ if(isPlaying()&&!dialog&&phase!=='transform'){ invOpen=!invOpen; sfx('clank'); } return; }
  if(invOpen){ if(a==='ok'||a==='atk') invOpen=false; return; }
  if(a==='heal'){ if(ambrosia>0&&P.hp<P.maxHp&&['wave','boss','free','gate'].includes(phase)){ ambrosia--; P.hp=Math.min(P.maxHp,P.hp+2); sfx('orb'); for(let i=0;i<20;i++){ const a2=rnd(0,6.28); parts.push({x:P.x,y:P.y-40,vx:Math.cos(a2)*120,vy:Math.sin(a2)*120-60,life:0.6,max:0.6,col:i%2?'#ffd23f':'#ffffff',sz:rnd(3,6),g:0}); } } return; }
  if(phase==='pause'){ if(a==='ok'||a==='atk') togglePause(); return; }
  if(phase==='title'){ if(a==='ok'||a==='atk') startGame(1); else if(a.startsWith('lv')) startGame(+a.slice(2)); return; }
  if(phase==='gameover'){ if(a==='ok'||a==='atk') retry(); return; }
  if(phase==='end'){ if(a==='ok'||a==='atk'){ if(phaseT>1){ phase='title'; phaseT=0; } } return; }
  if(dialog){ if(a==='ok'||a==='atk'){ if(dialog.shown<dialog.lines[dialog.i].length) dialog.shown=999; else { dialog.i++; dialog.shown=0; if(dialog.i>=dialog.lines.length){ const cb=dialog.done; dialog=null; cb&&cb(); } } } return; }
  if(phase==='transform'){ if((a==='ok'||a==='atk')&&phaseT>1.2){ if(lv===1) startFree(); else afterLevel(); } return; }
  if(a==='atk') attack(); else if(a==='dash') dash(); else if(a==='fire') power(); else if(a==='elem') cycleEl(); else if(a.startsWith('el:')) selectEl(a.slice(3));
}

/* ================= AÇÕES DO JOGADOR ================= */
function aimDir(){
  if(mouse.used&&!isTouch){ const dx=mouse.x-P.x, dy=mouse.y-(P.y-30), d=Math.hypot(dx,dy)||1; return [dx/d,dy/d]; }
  return [P.fx,P.fy];
}
function attack(){
  if(P.atkCd>0||P.dashT>0||P.stone>0) return;
  const [ax,ay]=aimDir(); if(mouse.used){ P.fx=ax; P.fy=ay; }
  P.atkT=0.16; P.atkCd=0.26; P.atkAt=0; P.atkDir=[ax,ay]; P.kx+=ax*90; P.ky+=ay*90;
  const hx=P.x+ax*42, hy=P.y-18+ay*30;
  slashes.push({x:hx,y:hy,a:Math.atan2(ay,ax),t:0.18});
  sfx('swish');
  let hit=false;
  for(const e of targets()){ if(near(e,hx,hy,e.type==='boss'?(e.hr||72):50)){ damage(e,1,ax,ay); hit=true; } }
  for(const v of vases) if(v.hp>0&&Math.hypot(v.x-hx,v.y-20-hy)<44){ breakVase(v); hit=true; }
}
function dash(){
  if(P.dashCd>0||P.stone>0) return;
  let dx=(K.right?1:0)-(K.left?1:0)+joy.vx, dy=(K.down?1:0)-(K.up?1:0)+joy.vy;
  if(Math.hypot(dx,dy)<0.2){ dx=P.fx; dy=P.fy; } const d=Math.hypot(dx,dy)||1;
  P.dx=dx/d; P.dy=dy/d; P.dashT=0.17; P.dashCd=0.5; sfx('dash');
  for(let i=0;i<10;i++) parts.push({x:P.x,y:P.y-4,vx:rnd(-80,80)-P.dx*120,vy:rnd(-40,10)-P.dy*80,life:0.4,max:0.4,col:'rgba(230,215,180,0.9)',sz:rnd(3,6),g:0});
}
function power(){
  const e=P.el; if(P.stone>0||P.fireCd>0) return;
  if(e==='normal'){ if(P.els.length<2) say('Sem poderes ainda','Vença o chefe para ganhar um elemento',1.4); else cycleEl(); return; }
  if(P.mp<PW[e]){ sfx('clank'); return; }
  const [ax,ay]=aimDir(); if(mouse.used){ P.fx=ax; P.fy=ay; }
  P.mp-=PW[e]; P.castT=0.3; P.fireCd=0.35;
  if(e==='fogo'){ sfx('fire'); shots.push({x:P.x+ax*30,y:P.y-34+ay*20,vx:ax*560,vy:ay*560,r:12,own:'p',dmg:3,life:1.4,kind:'fire'}); }
  else if(e==='planta'){ sfx('throw'); const a0=Math.atan2(ay,ax); for(let i=-2;i<=2;i++){ const a=a0+i*0.2; shots.push({x:P.x+Math.cos(a)*24,y:P.y-30+Math.sin(a)*16,vx:Math.cos(a)*480,vy:Math.sin(a)*480,r:9,own:'p',dmg:1,life:0.8,kind:'leaf',root:1.8}); } }
  else if(e==='agua'){ sfx('slam'); P.fireCd=0.6; pwaves.push({x:P.x,y:P.y,r:12,max:175,sp:520,hit:new Set()}); }
  else if(e==='raio'){ sfx('crash'); flashW=0.3; shake=Math.max(shake,6); const tg=nearestTarget(560);
    if(tg){ const q=hitPoint(tg); bolts.push({x0:q.x+rnd(-50,50),y0:-20,x1:q.x,y1:q.y,t:0.35}); damage(tg,4,0,0); sparks(q.x,q.y,16,'#fff27a'); }
    else { const x=P.x+ax*180, y=P.y+ay*120; bolts.push({x0:x+rnd(-40,40),y0:-20,x1:x,y1:y,t:0.35}); sparks(x,y,12,'#fff27a'); } }
}
function hitPts(e){ if(e.type!=='boss') return [{x:e.x,y:e.y-32}]; if(e.kind==='gemeos') return e.bodies.map(q=>({x:q.x,y:q.y-50})); return [{x:e.x,y:e.y-(e.hh||50)}]; }
function near(e,x,y,rad){ return hitPts(e).some(q=>Math.hypot(q.x-x,q.y-y)<rad); }
function hitPoint(e){ const l=hitPts(e); let best=l[0],bd=1e9; for(const q of l){ const d=Math.hypot(q.x-P.x,q.y-P.y); if(d<bd){ bd=d; best=q; } } return best; }
function nearestTarget(maxD){ let best=null,bd=maxD; for(const e of targets()){ const q=hitPoint(e), d=Math.hypot(q.x-P.x,q.y-P.y); if(d<bd){ bd=d; best=e; } } return best; }
function targets(){ const a=enemies.filter(e=>!e.dead); if(boss&&!boss.dead&&boss.state!=='enter') a.push(boss); return a; }
function damage(e,n,ax,ay){
  if(e.type==='boss'){ if(e.state==='stun') n*=2; e.hp-=n; e.flash=0.12; sfx('hitBig'); shake=Math.max(shake,4);
    { const q=hitPoint(e); sparks(q.x,q.y-10,12,'#ffe7a0'); } if(e.hp<=0) killBoss(); return; }
  e.hp-=n; e.flash=0.14; e.hurtT=0.25; e.kx=ax*260; e.ky=ay*260; if(e.state==='wind'){ e.state='recover'; e.t=0.4; }
  sfx('hit'); sparks(e.x,e.y-26,10,'#fff3c4'); shake=Math.max(shake,3);
  if(e.hp<=0){ e.dead=true; e.deadT=0.7; killCount++; pickups.push({x:e.x,y:e.y,kind:'moeda',t:0,vy:-180,z:0}); if(killCount%4===0) pickups.push({x:e.x+20,y:e.y,kind:'pocao',t:0,vy:-220,z:0}); cheer=Math.min(2,cheer+0.6); sfx('down'); sparks(e.x,e.y-20,20,'#ffd23f'); }
}
function hurt(n,sx,sy){
  if(P.inv>0||P.dashT>0||!['wave','boss','free'].includes(phase)) return;
  P.hp-=n; P.inv=1; hitsTaken++; hurtT=0.3; shake=10; sfx('hurt');
  const dx=P.x-sx, dy=P.y-sy, d=Math.hypot(dx,dy)||1; P.kx=dx/d*420; P.ky=dy/d*420;
  sparks(P.x,P.y-30,14,'#ff5a5a');
  try{ navigator.vibrate&&navigator.vibrate(80); }catch(e){}
  if(P.hp<=0){ P.hp=0; phase='gameover'; phaseT=0; sfx('lose'); }
}
function breakVase(v){ v.hp=0; sfx('crack'); cheer=Math.min(2,cheer+0.3);
  for(let i=0;i<16;i++) parts.push({x:v.x,y:v.y-22,vx:rnd(-220,220),vy:rnd(-260,-40),life:rnd(0.5,0.9),max:0.9,col:i%2?'#c8693a':'#8f4424',sz:rnd(4,8),g:700,sq:true}); }
function sparks(x,y,n,col){ for(let i=0;i<n;i++){ const a=rnd(0,6.28), s=rnd(80,300); parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(0.2,0.45),max:0.45,col,sz:rnd(2,5),g:200}); } }
function dust(x,y,n){ for(let i=0;i<n;i++) parts.push({x:x+rnd(-20,20),y:y+rnd(-6,6),vx:rnd(-90,90),vy:rnd(-60,-10),life:rnd(0.4,0.8),max:0.8,col:'rgba(220,196,150,0.85)',sz:rnd(4,9),g:40}); }
function killBoss(){
  for(const e of enemies) if(!e.dead){ e.dead=true; e.deadT=0.7; }
  boss.dead=true; boss.hp=0; boss.state='dying'; boss.t=0; phase='boss_dead'; phaseT=0; slow=0.25; shake=18; sfx('roar'); cheer=2;
  shots=[]; boss.waves=[];
}

/* ================= ATUALIZAÇÃO ================= */
function update(dt){
  t+=dt; phaseT+=dt; cheer=Math.max(0,cheer-dt*0.4); flashW=Math.max(0,flashW-dt*1.5); shake=Math.max(0,shake-dt*30);
  if(banner){ banner.t-=dt; if(banner.t<=0) banner=null; }
  if(dialog) dialog.shown+=dt*40;
  for(let i=parts.length-1;i>=0;i--){ const q=parts[i]; q.life-=dt; if(q.life<=0){ parts.splice(i,1); continue; } q.vy+=q.g*dt; q.x+=q.vx*dt; q.y+=q.vy*dt; q.vx*=0.97; q.vy*=0.97; }
  if(parts.length>700) parts.splice(0,parts.length-700);
  eclipse=Math.max(0,eclipse-dt);
  for(let i=bolts.length-1;i>=0;i--){ bolts[i].t-=dt; if(bolts[i].t<=0) bolts.splice(i,1); }
  for(let i=slashes.length-1;i>=0;i--){ slashes[i].t-=dt; if(slashes[i].t<=0) slashes.splice(i,1); }
  if(['wave','boss','free','boss_intro'].includes(phase)) gameTime+=dt;
  if(phase==='title'||phase==='end'||phase==='gameover') return;

  // jogador
  if(!dialog&&phase!=='transform'){
    let mx=(K.right?1:0)-(K.left?1:0)+joy.vx, my=(K.down?1:0)-(K.up?1:0)+joy.vy;
    const m=Math.hypot(mx,my); P.moving=m>0.15;
    if(m>1){ mx/=m; my/=m; }
    if(P.stone>0){ P.stone-=dt; mx=0; my=0; P.moving=false; if(P.stone<=0){ sparks(P.x,P.y-40,16,'#bdb8ae'); sfx('crack'); } }
    if(P.moving){ const d=Math.hypot(mx,my); P.fx=mx/d; P.fy=my/d; P.walk+=dt*10; }
    P.mp=Math.min(P.maxMp,P.mp+12*dt); P.castT-=dt; P.dashCd-=dt; P.atkCd-=dt; P.atkAt+=dt; hurtT-=dt; P.atkT-=dt; P.inv-=dt; P.fireCd-=dt;
    let vx,vy;
    if(P.dashT>0){ P.dashT-=dt; vx=P.dx*640; vy=P.dy*640; if(Math.random()<0.7) parts.push({x:P.x,y:P.y-30,vx:0,vy:0,life:0.2,max:0.2,ghost:true,flip:lastFacing>0,back:isBack(),sz:0,g:0,col:''}); }
    else { const sp=P.atkT>0?110:235; vx=mx*sp; vy=my*sp*0.85; }
    P.x+=(vx+P.kx)*dt; P.y+=(vy+P.ky)*dt; P.kx*=Math.pow(0.0005,dt); P.ky*=Math.pow(0.0005,dt);
    clampArena(P,P.r);
    if(false) parts.push({x:P.x+rnd(-18,18),y:P.y-rnd(10,60),vx:rnd(-15,15),vy:rnd(-90,-40),life:rnd(0.3,0.6),max:0.6,col:Math.random()<0.5?'#ff7a1a':'#ffd23f',sz:rnd(2,5),g:0});
  }

  if(isPlaying()) CatFX.update(dt,catState());
  // fases
  if(phase==='wave'){
    for(let i=waves.length-1;i>=0;i--){ waves[i].at-=dt; if(waves[i].at<=0){ spawnEnemy(waves[i].type); waves.splice(i,1); } }
    if(!waves.length&&enemies.every(e=>e.dead&&e.deadT<=0)&&phaseT>2){
      if(waveN<LEVELS[lv].waves.length) startWave(waveN+1);
      else if(phaseT>0){ phase='gate'; phaseT=0; sfx('rumble'); say('Os portões se abrem…','',2.2); }
    }
  }
  if(phase==='gate'){ gateOpen=Math.min(1,phaseT/2); shake=Math.max(shake,2); if(phaseT>2.4){ waveN=3; startBoss(); } }
  for(const e of enemies) updEnemy(e,dt);
  enemies=enemies.filter(e=>!(e.dead&&e.deadT<=-0.5));
  if(boss) updBoss(boss,dt);
  if(phase==='boss_intro'&&boss&&boss.state!=='enter'&&boss.state!=='roar'&&boss.state!=='descend'){ phase='boss'; phaseT=0; }

  // maremoto do jogador
  for(let i=pwaves.length-1;i>=0;i--){ const w=pwaves[i]; w.r+=w.sp*dt; if(w.r>w.max){ pwaves.splice(i,1); continue; }
    for(const e of targets()){ if(w.hit.has(e)) continue; const q=hitPoint(e); const pd=Math.hypot(q.x-w.x,(q.y+30-w.y)/0.55);
      if(pd<w.r+20){ w.hit.add(e); const dx=q.x-w.x, dy=q.y-w.y, d=Math.hypot(dx,dy)||1; damage(e,2,dx/d,dy/d); if(e.type!=='boss'){ e.kx=dx/d*520; e.ky=dy/d*520; } } }
    for(let j=shots.length-1;j>=0;j--){ const s2=shots[j]; if(s2.own==='e'&&s2.kind!=='trident'&&Math.hypot(s2.x-w.x,(s2.y+20-w.y)/0.55)<w.r){ sparks(s2.x,s2.y,5,'#bfe6ff'); shots.splice(j,1); } }
    for(const v of vases) if(v.hp>0&&Math.hypot(v.x-w.x,(v.y-w.y)/0.55)<w.r) breakVase(v);
    if(Math.random()<0.9){ const a=rnd(0,6.28); parts.push({x:w.x+Math.cos(a)*w.r,y:w.y+Math.sin(a)*w.r*0.55-6,vx:0,vy:-60,life:0.35,max:0.35,col:Math.random()<0.5?'#bfe6ff':'#5ab4ff',sz:rnd(3,7),g:0}); } }
  // coletáveis
  for(let i=pickups.length-1;i>=0;i--){ const k=pickups[i]; k.t+=dt; k.vy+=700*dt; k.z=Math.min(0,k.z+k.vy*dt); if(k.z>=0){ k.z=0; k.vy=0; }
    if(k.t>0.4&&Math.hypot(P.x-k.x,P.y-k.y)<34){ if(k.kind==='moeda') coins++; else ambrosia++; sfx('orb'); sparks(k.x,k.y-14,8,'#ffd23f'); pickups.splice(i,1); } }
  // projéteis
  for(let i=shots.length-1;i>=0;i--){ const s=shots[i]; s.age=(s.age||0)+dt;
    if(s.home&&s.age>0.3){ const a=Math.atan2(P.y-30-s.y,P.x-s.x), c=Math.atan2(s.vy,s.vx); let da=a-c; while(da>Math.PI) da-=6.283; while(da<-Math.PI) da+=6.283; const na=c+Math.max(-1.7*dt,Math.min(1.7*dt,da)), sp=Math.hypot(s.vx,s.vy); s.vx=Math.cos(na)*sp; s.vy=Math.sin(na)*sp; }
    if(s.kind==='trident'){ if(!boss||boss.dead){ shots.splice(i,1); continue; } if(s.age>0.8) { const dx=boss.x-s.x, dy=boss.y-60-s.y, d=Math.hypot(dx,dy)||1; s.vx=dx/d*600; s.vy=dy/d*600; if(d<40){ boss.trident=true; shots.splice(i,1); continue; } } s.life=9; }
    s.x+=s.vx*dt; s.y+=s.vy*dt; s.life-=dt;
    if(s.kind==='leaf'&&Math.random()<0.5) parts.push({x:s.x,y:s.y,vx:rnd(-20,20),vy:rnd(-20,20),life:0.3,max:0.3,col:Math.random()<0.5?'#6bd45a':'#d8f07a',sz:rnd(2,5),g:0});
    if(s.kind==='snake'||s.kind==='bubble'||s.kind==='moon'||s.kind==='fireE') if(Math.random()<0.35) parts.push({x:s.x,y:s.y,vx:0,vy:-20,life:0.3,max:0.3,col:s.col||'#fff',sz:rnd(2,4),g:0});
    if(s.kind==='fire'&&Math.random()<0.9) parts.push({x:s.x,y:s.y,vx:rnd(-30,30),vy:rnd(-30,30),life:0.3,max:0.3,col:Math.random()<0.5?'#ff7a1a':'#ffd23f',sz:rnd(3,7),g:-40});
    let gone=s.life<=0||(s.kind!=='trident'&&(Math.abs(s.x-CX)>540||s.y<-40||s.y>580));
    if(s.own==='e'&&!gone&&Math.hypot(s.x-P.x,s.y-(P.y-24))<(s.r>12?s.r+8:20)){ hurt(s.dmg||1,s.x,s.y); if(s.kind!=='trident') gone=true; }
    if(s.own==='p'&&!gone){
      for(const e of targets()){ if(near(e,s.x,s.y,e.type==='boss'?52:28)){ damage(e,s.dmg,s.vx/560,s.vy/560); if(s.root&&e.type!=='boss') e.root=s.root; gone=true; break; } }
      for(const v of vases) if(!gone&&v.hp>0&&Math.hypot(v.x-s.x,v.y-24-s.y)<28){ breakVase(v); gone=true; }
      if(gone){ const cc=s.kind==='leaf'?['#6bd45a','#d8f07a','#2f8a3a']:['#ff7a1a','#ffd23f','#ff3b1f']; if(s.kind!=='leaf') sfx('boom'); for(let k=0;k<(s.kind==='leaf'?6:18);k++){ const a=rnd(0,6.28),sp=rnd(60,240); parts.push({x:s.x,y:s.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rnd(0.3,0.6),max:0.6,col:cc[k%3],sz:rnd(3,8),g:-30}); } }
    }
    if(gone) shots.splice(i,1);
  }

  if(phase==='boss_dead'){
    slow=Math.min(1,slow+dt*0.6);
    if(phaseT>1.6&&!orb){ orb={x:boss.x,y:boss.y-60,z:0,t:0}; sfx('orb'); }
    if(orb){ orb.t+=dt; const k=Math.min(1,Math.max(0,(orb.t-0.8)/1.2));
      const sx=boss.x, sy=boss.y-60-Math.min(1,orb.t/0.8)*60;
      orb.x=sx+(P.x-sx)*k*k; orb.y=sy+((P.y-40)-sy)*k*k;
      if(Math.random()<0.8) parts.push({x:orb.x+rnd(-8,8),y:orb.y+rnd(-8,8),vx:rnd(-40,40),vy:rnd(-60,0),life:0.5,max:0.5,col:EL_INFO[LEVELS[lv].el].c[Math.floor(Math.random()*2)],sz:rnd(3,6),g:0});
      if(k>=1){ orb=null; boss=null; startTransform(); }
    }
  }
  if(phase==='free'&&vases.length&&vases.every(v=>v.hp<=0)&&phaseT>0.5){ phase='freeDone'; phaseT=0; }
  if(phase==='freeDone'&&phaseT>1.2) startLevel(2);
}

function spawnEnemy(type){
  const side=Math.random()<0.5?-1:1;
  const hp=type==='snake'?1:type==='spear'?2:(lv>=4?4:3);
  enemies.push({type,x:CX+side*(RX-30),y:CY+rnd(-30,30),r:20,hp,maxHp:hp,root:0,state:'chase',t:rnd(0.3,1),flash:0,kx:0,ky:0,face:-side,dead:false,deadT:0,anim:rnd(0,6),wx:0,wy:0});
  dust(CX+side*(RX-30),CY,8);
}
function updEnemy(e,dt){
  e.flash-=dt; e.hurtT=(e.hurtT||0)-dt; e.anim+=dt*8;
  if(e.dead){ e.deadT-=dt; return; }
  e.x+=e.kx*dt; e.y+=e.ky*dt; e.kx*=Math.pow(0.002,dt); e.ky*=Math.pow(0.002,dt);
  for(const o of enemies) if(o!==e&&!o.dead){ const d=dist(e,o); if(d<42&&d>0){ const p=(42-d)/2; e.x+=(e.x-o.x)/d*p; e.y+=(e.y-o.y)/d*p; } }
  if(boss&&!boss.dead){ const d=dist(e,boss); if(d<60&&d>0){ e.x+=(e.x-boss.x)/d*(60-d); e.y+=(e.y-boss.y)/d*(60-d); } }
  clampArena(e,e.r);
  if(e.root>0){ e.root-=dt; return; }
  const dx=P.x-e.x, dy=P.y-e.y, d=Math.hypot(dx,dy)||1;
  if(Math.abs(dx)>4) e.face=Math.sign(dx);
  const spd=1+(lv-1)*0.07;
  if(e.type==='snake'){
    if(e.state==='chase'){ e.x+=dx/d*140*dt; e.y+=dy/d*125*dt; e.t-=dt; if(d<46&&e.t<=0){ e.state='wind'; e.t=0.35; e.wx=dx/d; e.wy=dy/d; } }
    else if(e.state==='wind'){ e.t-=dt; if(e.t<=0){ e.x+=e.wx*26; e.y+=e.wy*20; if(Math.hypot(P.x-e.x,P.y-e.y)<36) hurt(1,e.x,e.y); e.state='recover'; e.t=0.7; sfx('swishE'); } }
    else { e.t-=dt; if(e.t<=0){ e.state='chase'; e.t=rnd(0.2,0.6); } }
    return;
  }
  if(e.type==='sword'){
    if(e.state==='chase'){ e.x+=dx/d*105*spd*dt; e.y+=dy/d*95*spd*dt; e.t-=dt; if(d<62&&e.t<=0){ e.state='wind'; e.t=0.5; e.wx=dx/d; e.wy=dy/d; sfx('clank'); } }
    else if(e.state==='wind'){ e.t-=dt*spd; if(e.t<=0){ e.state='slash'; e.t=0.16; e.x+=e.wx*24; e.y+=e.wy*24; sfx('swishE');
      const hx=e.x+e.wx*30, hy=e.y+e.wy*22; if(Math.hypot(P.x-hx,P.y-hy)<44) hurt(1,e.x,e.y); } }
    else if(e.state==='slash'){ e.t-=dt; if(e.t<=0){ e.state='recover'; e.t=0.6; } }
    else if(e.state==='recover'){ e.t-=dt; if(e.t<=0){ e.state='chase'; e.t=rnd(0.2,0.7); } }
  } else {
    if(e.state==='chase'){ const want=250; const s=d>want+30?1:d<want-40?-1:0; e.x+=dx/d*s*85*dt; e.y+=dy/d*s*75*dt;
      e.x+=-dy/d*40*dt*Math.sin(e.anim*0.2); e.t-=dt; if(e.t<=0&&d<420){ e.state='wind'; e.t=0.75; } }
    else if(e.state==='wind'){ e.t-=dt; e.wx=dx/d; e.wy=dy/d; if(e.t<=0){
      { const K_=e.artK==='glad_archer'?'arrow':['spear','spear','snake','spear','fireE','arrow'][lv]; shots.push({x:e.x+e.wx*20,y:e.y-34,vx:e.wx*400,vy:e.wy*400,r:K_==='fireE'?9:6,own:'e',dmg:1,life:2,kind:K_,col:K_==='snake'?'#7bd04a':K_==='fireE'?'#ff7a1a':'#ffd23f'}); } sfx('throw'); e.state='recover'; e.t=0.9; } }
    else if(e.state==='recover'){ e.t-=dt; if(e.t<=0){ e.state='chase'; e.t=rnd(1.2,2.2); } }
  }
}
function updBoss(b,dt){
  b.flash-=dt; b.anim+=dt;
  if(b.state==='dying'){ b.t+=dt; return; }
  for(let i=b.waves.length-1;i>=0;i--){ const w=b.waves[i]; if(w.delay>0){ w.delay-=dt; continue; } w.r+=w.sp*dt; if(w.r>w.max){ b.waves.splice(i,1); continue; }
    if(!w.hit){ const pd=Math.hypot(P.x-w.x,(P.y-w.y)/0.55); if(Math.abs(pd-w.r)<(w.w||20)){ w.hit=true; hurt(w.dmg||2,w.x,w.y); } } }
  for(let i=b.zones.length-1;i>=0;i--){ const z=b.zones[i]; z.t+=dt;
    if(!z.done&&z.t>=z.delay){ z.done=true; if(Math.hypot(P.x-z.x,(P.y-z.y)/0.55)<z.r) hurt(z.dmg||1,z.x,z.y); sfx('boom'); shake=Math.max(shake,5);
      for(let k=0;k<22;k++){ const a=rnd(0,6.28),s2=rnd(60,260); parts.push({x:z.x,y:z.y-10,vx:Math.cos(a)*s2,vy:Math.sin(a)*s2*0.5-120,life:rnd(0.3,0.7),max:0.7,col:z.cols[k%z.cols.length],sz:rnd(4,9),g:200}); } }
    if(z.t>z.delay+0.3) b.zones.splice(i,1); }
  if(b.kind==='mino') return updMino(b,dt);
  if(b.kind==='gemeos') return updGemeos(b,dt);
  // entrada genérica
  if(b.state==='enter'){ b.y+=70*dt; b.anim+=dt*2; if(b.y>=CY-70){ b.state='roar'; b.t=1.2; sfx('roar'); shake=12; } return; }
  if(b.state==='roar'){ b.t-=dt; if(b.t<=0){ b.state='walk'; b.t=1.0; } return; }
  if(!b.raged&&b.hp<=b.maxHp/2){ b.raged=true; b.state='roar'; b.t=1.1; sfx('roar'); shake=14; say('FÚRIA!','Os ataques ficaram mais rápidos',2); if(b.kind==='medusa') for(let i=0;i<2;i++) spawnEnemy('snake'); return; }
  const dx=P.x-b.x, dy=P.y-b.y, d=Math.hypot(dx,dy)||1;
  if(!['lunge'].includes(b.state)&&d<b.r+P.r&&d>0){ P.x=b.x+dx/d*(b.r+P.r); P.y=b.y+dy/d*(b.r+P.r); }
  if(b.state==='stun'){ b.t-=dt; if(b.t<=0){ b.state='walk'; b.t=0.8; } return; }
  if(b.kind==='medusa') updMedusa(b,dt,dx,dy,d); else if(b.kind==='tritao') updTritao(b,dt,dx,dy,d); else updCerbero(b,dt,dx,dy,d);
  clampArena(b,b.r);
}
function tired(b,txt_){ b.n++; if(b.n%3===0){ b.state='stun'; b.t=1.7; say(txt_,'Ataque agora: dano em dobro',1.3); return true; } return false; }
function fan(b,n,spread,speed,kind,col,y0){ const a0=Math.atan2(P.y-30-(b.y-y0),P.x-b.x); for(let i=0;i<n;i++){ const a=a0+(i-(n-1)/2)*spread; shots.push({x:b.x+Math.cos(a)*30,y:b.y-y0+Math.sin(a)*20,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,r:9,own:'e',dmg:1,life:3.5,kind,col}); } }
function updMedusa(b,dt,dx,dy,d){
  const sp=b.raged?1.3:1; if(Math.abs(dx)>6) b.face=Math.sign(dx);
  switch(b.state){
    case 'walk': { const want=230, s2=d>want+30?1:d<want-40?-1:0; b.x+=(dx/d*s2*80-dy/d*45)*sp*dt; b.y+=(dy/d*s2*70+dx/d*30)*sp*dt; b.t-=dt;
      if(b.t<=0){ const r=Math.random();
        if(r<0.4){ b.state='gazeWind'; b.t=1.15/sp; sfx('snort'); say('VIRE DE COSTAS!','',1.1/sp); }
        else if(d<190&&r<0.75){ b.state='tailWind'; b.t=0.6/sp; sfx('grunt'); }
        else { b.state='snakeWind'; b.t=0.6/sp; sfx('snort'); } } } break;
    case 'gazeWind': b.t-=dt; if(b.t<=0){ b.state='gaze'; b.t=0.55; flashW=0.35; sfx('power');

let AC=null,master=null,musG=null,noiseBuf=null,musicOn=true,step16=0,nextT=0;
function initAudio(){
  if(AC){ if(AC.state==='suspended') AC.resume().catch(()=>{}); return; }
  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); master=AC.createGain(); master.gain.value=0.55; master.connect(AC.destination);
    musG=AC.createGain(); musG.gain.value=0.3; musG.connect(master);
    noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    nextT=AC.currentTime+0.1; setInterval(sched,25); }catch(e){ AC=null; }
}
function tone(f,dur,type,vol,slide,at,dest){ if(!AC) return; at=at||AC.currentTime; const o=AC.createOscillator(),g=AC.createGain(); o.type=type; o.frequency.setValueAtTime(f,at);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide,at+dur); g.gain.setValueAtTime(vol,at); g.gain.exponentialRampToValueAtTime(0.0008,at+dur);
  o.connect(g); g.connect(dest||master); o.start(at); o.stop(at+dur+0.03); }
function noise(dur,vol,freq,type,at,dest){ if(!AC) return; at=at||AC.currentTime; const s=AC.createBufferSource(); s.buffer=noiseBuf; const f=AC.createBiquadFilter(); f.type=type||'bandpass'; f.frequency.value=freq||1000;
  const g=AC.createGain(); g.gain.setValueAtTime(vol,at); g.gain.exponentialRampToValueAtTime(0.0008,at+dur); s.connect(f); f.connect(g); g.connect(dest||master); s.start(at); s.stop(at+dur+0.02); }
function sfx(n){ if(!AC) return; const c=AC.currentTime;
  switch(n){
    case 'swish': noise(0.12,0.25,3000,'bandpass'); break;
    case 'swishE': noise(0.14,0.18,1800,'bandpass'); break;
    case 'hit': tone(220,0.1,'square',0.12,90); noise(0.08,0.2,1200); break;
    case 'hitBig': tone(140,0.14,'square',0.14,60); noise(0.1,0.25,800); break;
    case 'down': tone(300,0.3,'triangle',0.15,80); break;
    case 'dash': noise(0.16,0.2,600,'lowpass'); tone(500,0.12,'sine',0.08,900); break;
    case 'hurt': tone(600,0.25,'sawtooth',0.12,150); break;
    case 'clank': tone(1400,0.06,'square',0.05); tone(1900,0.05,'square',0.04,null,c+0.04); break;
    case 'throw': noise(0.2,0.15,2500,'highpass'); break;
    case 'roar': tone(90,1.0,'sawtooth',0.25,45); tone(130,0.9,'sawtooth',0.15,60); noise(0.9,0.25,400,'lowpass'); break;
    case 'grunt': tone(110,0.25,'sawtooth',0.18,70); break;
    case 'snort': noise(0.3,0.25,500,'bandpass'); noise(0.3,0.2,500,'bandpass',c+0.35); break;
    case 'charge': tone(80,0.5,'sawtooth',0.2,160); break;
    case 'crash': noise(0.5,0.45,300,'lowpass'); tone(60,0.4,'sine',0.5,30); break;
    case 'slam': noise(0.45,0.45,250,'lowpass'); tone(70,0.4,'sine',0.6,30); break;
    case 'horn': [0,0.25].forEach((d,i)=>{ tone(i?330:220,0.5,'sawtooth',0.08,null,c+d); tone(i?165:110,0.5,'square',0.05,null,c+d); }); break;
    case 'rumble': noise(2.2,0.3,120,'lowpass'); break;
    case 'orb': [0,0.15,0.3,0.45].forEach((d,i)=>tone(440*Math.pow(1.26,i),0.4,'sine',0.1,null,c+d)); break;
    case 'power': [523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,0.35,'square',0.06,null,c+i*0.07)); noise(1,0.3,800,'bandpass'); break;
    case 'fire': noise(0.25,0.25,900,'bandpass'); tone(300,0.2,'sawtooth',0.06,120); break;
    case 'boom': noise(0.3,0.3,500,'lowpass'); break;
    case 'crack': noise(0.15,0.3,2200,'bandpass'); tone(700,0.08,'square',0.06,300); break;
    case 'win': [392,523,659,784,1047].forEach((f,i)=>tone(f,0.4,'square',0.07,null,c+i*0.12)); break;
    case 'lose': [392,330,262,196].forEach((f,i)=>tone(f,0.35,'triangle',0.12,null,c+i*0.18)); break;
  } }
// trilha: modo frígio dominante em Mi (clima grego/épico)
const SCALE=[0,1,4,5,7,8,10];
const mtof=m=>440*Math.pow(2,(m-69)/12);
function sched(){
  if(!AC) return;
  const bossMode=['boss','boss_intro','boss_dead'].includes(phase)||(phase==='pause'&&['boss','boss_intro'].includes(prevPhase));
  const bpm=bossMode?150:118, S=60/bpm/4;
  while(nextT<AC.currentTime+0.12){
    const i=step16%16, bar=Math.floor(step16/16)%4;
    if(musicOn&&phase!=='pause'&&phase!=='gameover'){
      const root=40+[0,0,1,-2][bar];
      if(i%4===0||i===14) tone(mtof(root-12),S*1.8,'triangle',0.35,null,nextT,musG);
      if(i===0||i===8||(bossMode&&i===10)) tone(120,0.18,'sine',0.6,45,nextT,musG);
      if(i===4||i===12) noise(0.12,0.12,1500,'bandpass',nextT,musG);
      if(i%2===1) noise(0.03,0.04,7000,'highpass',nextT,musG);
      const mel=[0,null,1,2, null,1,0,null, 2,null,4,3, 2,null,1,null];
      if(mel[i]!==null&&phase!=='title'){ const deg=mel[(i+bar*3)%16]; if(deg!==null){ const n=52+SCALE[deg%7]+(bossMode?12:0); tone(mtof(n),S*1.5,'square',bossMode?0.04:0.03,null,nextT,musG); } }
      if(phase==='title'&&i%4===2) tone(mtof(64+SCALE[(bar+i)%7]),S*3,'sine',0.05,null,nextT,musG);
    }
    nextT+=S; step16++;
  }
}

    for(let i=0;i<8;i++){ const a=rnd(0,6.28), x=CX+Math.cos(a)*RX*0.8, y=CY+Math.sin(a)*RY*0.8; g.fillStyle=['#ff8a6a','#ffd23f','#e46ab8'][i%3]; g.beginPath(); g.arc(x,y,4,0,7); g.fill(); g.strokeStyle=INK; g.lineWidth=1.5; g.stroke(); } }
  if(TH.deco==='lava'){ g.save(); g.lineCap='round'; for(let i=0;i<14;i++){ let x=CX+rnd(-RX*0.85,RX*0.85), y=CY+rnd(-RY*0.75,RY*0.75); const pts=[[x,y]]; for(let k=0;k<5;k++){ x+=rnd(-28,28); y+=rnd(-10,10); pts.push([x,y]); }
      for(const [lw,c] of [[9,'rgba(255,80,20,0.25)'],[4,'#ff6a1a'],[1.5,'#ffd23f']]){ g.strokeStyle=c; g.lineWidth=lw; g.beginPath(); pts.forEach((p,j)=>j?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])); g.stroke(); } } g.restore(); }

function buildArena(theme){
  TH=THEMES[theme||'coliseu']; crowd.length=0;
  LBACK=mk(W,H); let g=LBACK.getContext('2d');
  const sky=g.createLinearGradient(0,0,0,200); sky.addColorStop(0,TH.sky[0]); sky.addColorStop(1,TH.sky[1]); g.fillStyle=sky; g.fillRect(0,0,W,H);
  if(TH.clouds){ g.fillStyle=TH.cloud||'#fff'; } if(TH.clouds) for(const [x,y,s] of [[120,40,1],[760,30,1.3],[520,60,0.8]]){ g.beginPath(); g.ellipse(x,y,40*s,14*s,0,0,7); g.ellipse(x+30*s,y-8*s,30*s,14*s,0,0,7); g.fill(); g.strokeStyle=INK; g.lineWidth=2; g.stroke(); }
  // arquibancadas
  const tiers=[[600,300,TH.tiers[0]],[560,272,TH.tiers[1]],[525,246,TH.tiers[2]],[490,222,TH.tiers[3]]];
  for(const [rx,ry,col] of tiers){ g.fillStyle=col; g.beginPath(); g.ellipse(CX,CY+10,rx,ry,0,Math.PI,2*Math.PI); g.lineTo(CX+rx,H); g.lineTo(CX-rx,H); g.closePath(); g.fill(); g.strokeStyle=INK; g.lineWidth=2.5; g.stroke(); }
  // arcos no topo
  g.save(); g.beginPath(); g.ellipse(CX,CY+10,600,300,0,Math.PI,2*Math.PI); g.clip();
  for(let a=Math.PI+0.05;a<2*Math.PI;a+=0.075){ const x=CX+Math.cos(a)*585, y=CY+10+Math.sin(a)*290; g.fillStyle=TH.arch; g.strokeStyle=INK; g.lineWidth=2;
    g.beginPath(); g.moveTo(x-9,y+26); g.lineTo(x-9,y+8); g.arc(x,y+8,9,Math.PI,0); g.lineTo(x+9,y+26); g.closePath(); g.fill(); g.stroke(); }
  g.restore();
  for(let k=0;k<3;k++){ const rx=575-k*36, ry=262-k*26; for(let a=Math.PI+0.12;a<2*Math.PI-0.12;a+=0.032+k*0.004){
    crowd.push({x:CX+Math.cos(a)*rx+rnd(-4,4),y:CY+10+Math.sin(a)*ry+rnd(-3,3),c:TH.crowd[Math.floor(Math.random()*TH.crowd.length)],p:rnd(0,6)}); } }
  // portão do Minotauro
  const gx=CX, gy=CY-RY-8;
  g.fillStyle=TH.gate[0]; g.strokeStyle=INK; g.lineWidth=3; g.beginPath(); g.rect(gx-70,gy-88,140,92); g.fill(); g.stroke();
  g.fillStyle=TH.gate[1]; g.fillRect(gx-82,gy-102,164,18); g.strokeRect(gx-82,gy-102,164,18);
  g.fillStyle='#2a1b10'; g.beginPath(); g.moveTo(gx-42,gy+4); g.lineTo(gx-42,gy-48); g.arc(gx,gy-48,42,Math.PI,0); g.lineTo(gx+42,gy+4); g.closePath(); g.fill(); g.stroke();
  // portões laterais
  for(const s of [-1,1]){ const x=CX+s*(RX+40), y=CY-10; g.fillStyle='#2a1b10'; g.beginPath(); g.moveTo(x-22,y+40); g.lineTo(x-22,y); g.arc(x,y,22,Math.PI,0); g.lineTo(x+22,y+40); g.closePath(); g.fill(); g.stroke(); }

  LFLOOR=mk(W,H); g=LFLOOR.getContext('2d');
  // muro do anel
  g.fillStyle=TH.ring; g.strokeStyle=INK; g.lineWidth=3; g.beginPath(); g.ellipse(CX,CY,RX+34,RY+24,0,0,7); g.fill(); g.stroke();
  g.lineWidth=1.5; g.strokeStyle='rgba(43,33,24,0.55)';
  for(let a=0;a<6.28;a+=0.09){ g.beginPath(); g.moveTo(CX+Math.cos(a)*(RX+4),CY+Math.sin(a)*(RY+2)); g.lineTo(CX+Math.cos(a)*(RX+34),CY+Math.sin(a)*(RY+24)); g.stroke(); }
  // piso
  const sand=g.createRadialGradient(CX,CY,20,CX,CY,RX); sand.addColorStop(0,TH.floor[0]); sand.addColorStop(1,TH.floor[1]);
  g.fillStyle=sand; g.strokeStyle=INK; g.lineWidth=3; g.beginPath(); g.ellipse(CX,CY,RX+4,RY+2,0,0,7); g.fill(); g.stroke();
  g.strokeStyle='rgba(43,33,24,0.35)'; g.lineWidth=1.6;
  for(const k of [0.3,0.55,0.8]){ g.beginPath(); g.ellipse(CX,CY,RX*k,RY*k,0,0,7); g.stroke(); }
  for(let a=0;a<6.28;a+=0.2){ g.beginPath(); g.moveTo(CX+Math.cos(a)*RX*0.55,CY+Math.sin(a)*RY*0.55); g.lineTo(CX+Math.cos(a)*RX,CY+Math.sin(a)*RY); g.stroke(); }
  for(let a=0.1;a<6.28;a+=0.4){ g.beginPath(); g.moveTo(CX+Math.cos(a)*RX*0.3,CY+Math.sin(a)*RY*0.3); g.lineTo(CX+Math.cos(a)*RX*0.55,CY+Math.sin(a)*RY*0.55); g.stroke(); }
  for(let i=0;i<40;i++){ const a=rnd(0,6.28), r=rnd(0,0.95); g.strokeStyle='rgba(43,33,24,0.25)'; const x=CX+Math.cos(a)*RX*r, y=CY+Math.sin(a)*RY*r;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+rnd(-14,14),y+rnd(-5,5)); g.stroke(); }
  // textura de areia
  g.save(); g.beginPath(); g.ellipse(CX,CY,RX+2,RY,0,0,7); g.clip();
  for(let i=0;i<3200;i++){ const a=rnd(0,6.28), r=Math.sqrt(Math.random()); const x=CX+Math.cos(a)*RX*r, y=CY+Math.sin(a)*RY*r;
    g.fillStyle=Math.random()<0.5?TH.tex[0]:TH.tex[1]; g.fillRect(x,y,rnd(1,2.4),rnd(1,1.8)); }
  for(let i=0;i<14;i++){ const a=rnd(0,6.28), r=rnd(0.1,0.9); const x=CX+Math.cos(a)*RX*r, y=CY+Math.sin(a)*RY*r;
    g.fillStyle=TH.spot; g.beginPath(); g.ellipse(x,y,rnd(20,50),rnd(6,12),0,0,7); g.fill(); }
  decorFloor(g);
  // sombras das colunas (sol vindo do alto à direita)
  g.fillStyle='rgba(70,40,30,0.22)';
  for(const f of [-0.32,-0.2,0.2,0.32]){ const a=Math.PI*1.5+f*Math.PI, bx=CX+Math.cos(a)*(RX+18), by=CY+Math.sin(a)*(RY+14);
    g.beginPath(); g.moveTo(bx-14,by); g.lineTo(bx+14,by); g.lineTo(bx-60,by+110); g.lineTo(bx-92,by+104); g.closePath(); g.fill(); }
  g.restore();
  // colunas no fundo
  const cols=[-0.32,-0.2,0.2,0.32].map(f=>Math.PI*1.5+f*Math.PI);
  for(const a of cols){ column(g,CX+Math.cos(a)*(RX+18),CY+Math.sin(a)*(RY+14),118); }
  column(g,CX-RX-20,CY-40,96); column(g,CX+RX+20,CY-40,96);

  LFRONT=mk(W,H); g=LFRONT.getContext('2d');
  g.save(); g.beginPath(); g.rect(0,CY+30,W,H); g.clip();
  g.fillStyle=TH.front[0]; g.strokeStyle=INK; g.lineWidth=3;
  g.beginPath(); g.ellipse(CX,CY,RX+34,RY+24,0,0,Math.PI); g.lineTo(CX-RX-34,H+10); g.lineTo(CX+RX+34,H+10); g.closePath(); g.fill(); g.stroke();
  g.fillStyle=TH.front[1]; g.beginPath(); g.ellipse(CX,CY,RX+34,RY+24,0,0,Math.PI); g.ellipse(CX,CY+16,RX+34,RY+24,0,Math.PI,0,true); g.fill(); g.stroke();
  g.strokeStyle='rgba(43,33,24,0.5)'; g.lineWidth=1.5;
  for(let row=0;row<4;row++) for(let a=0.15+row*0.05;a<Math.PI;a+=0.12){ const x=CX+Math.cos(a)*(RX+34), y=CY+16+Math.sin(a)*(RY+24)+row*14; g.strokeRect(x-12,y,24,12); }
  g.restore();
  for(const f of [0.18,0.82]){ const a=f*Math.PI; stump(g,CX+Math.cos(a)*(RX+30),CY+Math.sin(a)*(RY+22)+26); }
  decorFront(g);
}
function column(g,x,y,h){
  g.strokeStyle=INK; g.lineWidth=2.5; g.fillStyle=TH.col;
  g.fillRect(x-20,y-10,40,12); g.strokeRect(x-20,y-10,40,12);
  g.fillRect(x-14,y-h,28,h-10); g.strokeRect(x-14,y-h,28,h-10);
  g.lineWidth=1.3; for(const dx of [-7,0,7]){ g.beginPath(); g.moveTo(x+dx,y-h+4); g.lineTo(x+dx,y-14); g.stroke(); }
  g.lineWidth=2.5; g.fillRect(x-22,y-h-14,44,14); g.strokeRect(x-22,y-h-14,44,14);
}
function stump(g,x,y){ g.strokeStyle=INK; g.lineWidth=2.5; g.fillStyle=TH.col; g.fillRect(x-22,y-6,44,10); g.strokeRect(x-22,y-6,44,10);
  g.fillRect(x-15,y-40,30,34); g.strokeRect(x-15,y-40,30,34); g.fillRect(x-20,y-48,40,10); g.strokeRect(x-20,y-48,40,10); }

function shadow(x,y,rx){ ctx.fillStyle='rgba(43,33,24,0.25)'; ctx.beginPath(); ctx.ellipse(x,y,rx,rx*0.35,0,0,7); ctx.fill(); }
function isBack(){ return P.fy<-0.55&&Math.abs(P.fx)<0.75; }
function catAnim(){ if(hurtT>0) return ['hurt',0.3-hurtT]; if(P.dashT>0) return ['dash',0]; if(P.atkAt<0.3) return ['scratch',P.atkAt]; if(P.moving&&!dialog) return ['walk',0]; return ['idle',0]; }
const CAT_H=96;
function catState(){ return {x:P.x,y:P.y,h:CAT_H,skin:P.stone>0?'normal':P.el,moving:P.moving&&!dialog,facing:lastFacing}; }
const SPR_S=0.68, SPR_AX=114, SPR_AY=146;   // quadros reduzidos a 228x151
function catFrame(o){
  if(o.ghost) return [10,o.flip?1:-1,0];
  if(hurtT>0) return [1,lastFacing,0];
  if(P.dashT>0){ const k=1-P.dashT/0.17; return [9+Math.min(2,Math.floor(k*3)),P.dx>=0?1:-1,0]; }
  if(P.stone>0) return [P.atkAt<0.3?12:(P.moving?5:0),lastFacing,0];
  if(P.castT>0) return [P.castT>0.15?14:15,lastFacing,0];
  if(P.atkAt<0.3){ const f=P.atkDir[0]>0.2?1:P.atkDir[0]<-0.2?-1:lastFacing; return [P.atkAt<0.08?12:13,f,0]; }
  const back=isBack();
  if(P.moving&&!dialog){
    if(back) return [3,1,Math.abs(Math.sin(t*12))*3];
    if(Math.abs(P.fx)<0.3&&P.fy>0) return [0,1,Math.abs(Math.sin(t*12))*3];
    return [4+Math.floor(t*10)%4,lastFacing,0];
  }
  if(back) return [3,1,0];
  return [Math.abs(P.fx)>0.5?2:0,lastFacing,0];
}
function drawCat(x,y,alpha,o){
  o=o||{}; if(P.fx>0.1) lastFacing=1; else if(P.fx<-0.1) lastFacing=-1;
  const [fi,face,bob]=catFrame(o), im=(SPRS[o.ghost?P.el:skinNow()]||SPRS.normal)[fi]; if(!im||!im.complete) return;
  const breathe=(!P.moving&&!o.ghost)?1+Math.sin(t*3)*0.015:1;
  ctx.save(); ctx.globalAlpha=alpha*(o.ghost?0.45:1); ctx.translate(x,y-bob); ctx.scale(face*SPR_S,SPR_S*breathe);
  let f=[]; if(o.ghost) f.push('brightness(2.2) saturate(0.2)');
  if(!o.ghost&&hurtT>0.2) f.push('brightness(3)'); if(f.length) ctx.filter=f.join(' ');
  ctx.drawImage(im,-SPR_AX,-SPR_AY);
  ctx.restore();
}
function drawSprite(fi,x,y,sc,face,sk){ const im=(SPRS[sk||P.el]||SPRS.normal)[fi]; if(!im||!im.complete) return; ctx.save(); ctx.translate(x,y); ctx.scale((face||1)*sc,sc); ctx.drawImage(im,-SPR_AX,-SPR_AY); ctx.restore(); }

function drawSnakeE(e,a){
  const W_=e.flash>0?'#ffffff':null; ctx.save(); ctx.globalAlpha=Math.min(1,a); ctx.translate(e.x,e.y); shadow(0,0,14);
  ctx.strokeStyle=INK; ctx.lineWidth=11; ctx.lineCap='round'; ctx.beginPath(); for(let i=0;i<=8;i++){ const x=-e.face*(i*4-10), y=-6-Math.sin(e.anim+i*0.8)*4-(8-i)*1.5; i?ctx.lineTo(x,y):ctx.moveTo(x,y); } ctx.stroke();
  ctx.strokeStyle=W_||'#5aa83a'; ctx.lineWidth=7; ctx.stroke();

  if(e.state==='wind'){ ctx.fillStyle='#ff3b1f'; ctx.font='700 20px '+FONT; ctx.textAlign='center'; ctx.fillText('!',0,-40); }

    txt('Parte 2: o gato que virou deus — em breve',W/2,392,18,'#ff9a5a');
    if(phaseT>1&&Math.sin(t*4)>-0.3) txt(isTouch?'toque para voltar ao início':'ENTER para voltar ao início',W/2,H-40,18,'#ffe7a0');
  }

  if(isTouch&&joy.id!==null){ const o=toLogical(joy.ox,joy.oy), p=toLogical(joy.x,joy.y);
    ctx.globalAlpha=0.5; ctx.strokeStyle=INK; ctx.lineWidth=3; ctx.fillStyle='#fff8e6'; ctx.beginPath(); ctx.arc(o.x,o.y,60/scale,0,7); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#ffd23f'; ctx.beginPath(); ctx.arc(p.x,p.y,24/scale,0,7); ctx.fill(); ctx.stroke(); ctx.globalAlpha=1; }
}

const motes=[]; for(let i=0;i<46;i++) motes.push({x:Math.random()*W,y:Math.random()*H,s:rnd(1,2.6),v:rnd(4,14),p:rnd(0,6)});
function lighting(){
  ctx.save(); const AA=ART['arena'+lv]&&ART['arena'+lv].complete&&!['title','end'].includes(phase);
  if(AA){ ctx.globalAlpha=0.35; }
  ctx.globalCompositeOperation='soft-light';
  const sun=ctx.createRadialGradient(W*0.82,-60,40,W*0.82,-60,1000); sun.addColorStop(0,TH.sun[0]); sun.addColorStop(0.5,TH.sun[1]); sun.addColorStop(1,TH.sun[2]);
  ctx.fillStyle=sun; ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='screen';
  if(TH.rays) for(let i=0;i<3;i++){ const x=W*(0.62+i*0.12)+Math.sin(t*0.3+i)*10; ctx.globalAlpha=0.1+0.03*Math.sin(t*0.7+i*2);
    const gr=ctx.createLinearGradient(x,0,x-260,H); gr.addColorStop(0,'rgba(255,240,200,1)'); gr.addColorStop(1,'rgba(255,240,200,0)'); ctx.fillStyle=gr;
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x+60,0); ctx.lineTo(x-200,H); ctx.lineTo(x-300,H); ctx.closePath(); ctx.fill(); }
  ctx.globalAlpha=1;
  if(AA){ ctx.globalAlpha=0.6; }
  for(const m of motes){ m.y-=m.v*0.016*(TH.bubbles||TH.embers?2.5:1); m.x+=Math.sin(t*0.6+m.p)*0.2; if(m.y<-5){ m.y=H+5; m.x=Math.random()*W; }
    ctx.globalAlpha=0.25+0.25*Math.sin(t*2+m.p); if(TH.bubbles){ ctx.strokeStyle=TH.mote; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(m.x,m.y,m.s*1.6,0,7); ctx.stroke(); } else { ctx.fillStyle=TH.mote; ctx.beginPath(); ctx.arc(m.x,m.y,m.s,0,7); ctx.fill(); } }
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
  const v=ctx.createRadialGradient(W/2,H*0.55,H*0.35,W/2,H*0.55,W*0.72); v.addColorStop(0,'rgba(30,15,10,0)'); v.addColorStop(1,AA?'rgba(30,15,10,0.32)':'rgba(30,15,10,0.5)');
  ctx.fillStyle=v; ctx.fillRect(0,0,W,H);
  ctx.restore();
}
function render(){

  const sx=shake>0?rnd(-shake,shake)*0.6:0, sy=shake>0?rnd(-shake,shake)*0.6:0;
  ctx.setTransform(scale*dpr,0,0,scale*dpr,(offX+sx*scale)*dpr,(offY+sy*scale)*dpr);
  ctx.save(); ctx.beginPath(); ctx.rect(0,0,W,H); ctx.clip();
  drawScene();
  lighting();
  if(phase!=='title'&&phase!=='end'&&phase!=='transform') drawHUD();
  drawOverlays();
  if(invOpen) drawBag();
  ctx.restore();
}
function resize(){ dpr=Math.min(devicePixelRatio||1,2); cv.width=innerWidth*dpr; cv.height=innerHeight*dpr; cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';
  scale=Math.min(innerWidth/W,innerHeight/H); offX=(innerWidth-W*scale)/2; offY=(innerHeight-H*scale)/2; }
addEventListener('resize',resize); resize(); buildArena('coliseu');
let last=performance.now();
let lastErr=null, errT=0, errCount=0;
function noteErr(where,e){ errCount++; lastErr=where+': '+(e&&e.message||e)+' ['+phase+' F'+lv+(boss?' '+boss.kind+':'+boss.state:'')+']'; errT=12; try{ console.error(lastErr,e); }catch(_){} }
function frame(now){ requestAnimationFrame(frame); let d=Math.min(0.05,(now-last)/1000); last=now;
  try{ if(phase!=='pause'&&!invOpen) update(d*slow); else t+=d; }catch(e){ noteErr('update',e); }
  try{ render(); }catch(e){ noteErr('render',e); if(ctx.reset) ctx.reset(); else for(let i=0;i<40;i++) ctx.restore(); }
  if(errT>0){ errT-=d; ctx.setTransform(dpr,0,0,dpr,0,0); ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over'; ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(0,innerHeight-22,innerWidth,22); ctx.fillStyle='#ffd23f'; ctx.font='12px monospace'; ctx.textAlign='left'; ctx.fillText('ERRO (mande foto): '+lastErr,6,innerHeight-7); } }
requestAnimationFrame(frame); cv.focus();
